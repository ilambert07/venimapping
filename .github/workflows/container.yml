name: Container CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container
        run: |
          docker build \
            --platform ${{ matrix.platform }} \
            -f .devcontainer/Dockerfile \
            -t venimapping:test .

      - name: Test container
        run: |
          docker run --rm venimapping:test bash -lc '
            set -eo pipefail
            test "$(id -u)" = "1000"
            test "$(whoami)" = "dev"
            test "$ROS_DISTRO" = "jazzy"
            ros2 pkg list | grep "^rclcpp$"
            command -v clang-tidy-20
            command -v clang-apply-replacements-20
            command -v run-clang-tidy
            test -L /home/dev/workspace/upstream/ros2-jazzy/install
            test "$(readlink /home/dev/workspace/upstream/ros2-jazzy/install)" = "/opt/ros/jazzy"
            test -f /home/dev/workspace/upstream/ros2-jazzy/install/setup.bash
            test -f /home/dev/workspace/upstream/vimbax-ros2-driver/install/setup.bash
            test -d /home/dev/workspace/upstream/vimbax-sdk/cti
            test -n "$GENICAM_GENTL64_PATH"
            printf "%s\n" "$GENICAM_GENTL64_PATH" | tr ":" "\n" | while IFS= read -r path; do
              test -n "$path"
              test -d "$path"
            done
          '

      - name: Verify SDK and driver
        run: |
          docker run --rm venimapping:test bash -lc '
            set -eo pipefail
            id
            /tmp/vimbax-sdk-bootstrap/bootstrap-vimbax-sdk verify \
              --sdk-dir /home/dev/workspace/upstream/vimbax-sdk
            log="$(mktemp)"
            env -u ROS_DISTRO \
              -u ROS_VERSION \
              -u AMENT_PREFIX_PATH \
              -u COLCON_PREFIX_PATH \
              /tmp/vimbax-ros2-driver-bootstrap/bootstrap-vimbax-ros2-driver \
              verify \
              --ros-underlay /opt/ros/jazzy \
              --sdk-dir /home/dev/workspace/upstream/vimbax-sdk \
              2>&1 | tee "${log}"
            if ! grep -Fq "smoke test passed" "${log}"; then
              echo "driver smoke test did not pass" >&2
              exit 1
            fi
          '

      - name: Prepare checkout ownership
        run: |
          id
          stat -c '%u:%g %n' "$GITHUB_WORKSPACE"
          dev_owner="$(docker run --rm --entrypoint sh venimapping:test -c 'echo "$(id -u):$(id -g)"')"
          echo "dev owner: ${dev_owner}"
          sudo chown -R "${dev_owner}" "$GITHUB_WORKSPACE"

      - name: Build and check the checkout
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/dev/venimapping" \
            -w /home/dev/venimapping \
            venimapping:test bash -lc '
              set -eo pipefail
              source scripts/env.sh
              colcon build --symlink-install
              test -s build/venimapping_camera/compile_commands.json
              grep -q "/home/dev/venimapping/src/venimapping_camera/" build/venimapping_camera/compile_commands.json
              colcon test
              colcon test-result --verbose
              ./scripts/ide.sh
              ./scripts/tidy.sh check
              report=build/venimapping_camera/tidy/report.txt
              grep -q "/home/dev/venimapping/src/venimapping_camera/" "${report}"
              if grep -E ": (warning|error): " "${report}"; then
                echo "clang-tidy reported findings" >&2
                exit 1
              fi
            '

      - name: Restore checkout ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
